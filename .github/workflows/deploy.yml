name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Allow deploying by hand from the Actions tab.
  workflow_dispatch:

# GITHUB_TOKEN needs these to publish a Pages artifact.
permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it, so Pages is never
# left serving a half-published build.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # onBrokenLinks is 'throw', so a broken internal link fails the deploy
      # here rather than shipping.
      - name: Build
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
